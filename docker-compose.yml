services:
  web:
    build: .
    image: finanpy-web
    # Aplica as migrações na inicialização e sobe o servidor de desenvolvimento.
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000
    ports:
      - '8000:8000'
    environment:
      # Valores lidos do arquivo .env (opcional, veja .env.example);
      # sem ele, valem os padrões de desenvolvimento.
      SECRET_KEY: ${SECRET_KEY:-django-insecure-troque-esta-chave}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      SQLITE_PATH: /app/data/db.sqlite
      # Agente de IA (seção 14.12 do PRD). Sem OPENAI_API_KEY a geração
      # fica desabilitada.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-gpt-5-mini}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-60}
      AI_MAX_COMPLETION_TOKENS: ${AI_MAX_COMPLETION_TOKENS:-4000}
      AI_MIN_TRANSACTIONS: ${AI_MIN_TRANSACTIONS:-5}
      AI_MANUAL_COOLDOWN_MINUTES: ${AI_MANUAL_COOLDOWN_MINUTES:-60}
    volumes:
      # Persiste o db.sqlite entre reinicializações e recriações do container.
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:
