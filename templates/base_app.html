{% extends 'base.html' %}

{% block body %}
  {% include 'components/_sidebar.html' %}

  <div class="flex min-h-full flex-col lg:pl-64">
    {% include 'components/_topbar.html' %}

    <main class="mx-auto w-full max-w-7xl px-4 py-6 md:px-8 md:py-8">
      {% include 'components/_messages.html' %}
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    (function () {
      var toggle = document.getElementById('sidebar-toggle');
      var sidebar = document.getElementById('sidebar');
      function setOpen(open) {
        sidebar.classList.toggle('hidden', !open);
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
      }
      toggle.addEventListener('click', function () {
        var open = sidebar.classList.contains('hidden');
        setOpen(open);
        if (open) { sidebar.querySelector('a').focus(); }
      });
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && toggle.getAttribute('aria-expanded') === 'true') {
          setOpen(false);
          toggle.focus();
        }
      });
    })();
  </script>
{% endblock %}
