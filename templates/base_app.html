{% extends 'base.html' %}

{% block body %}
  {% include 'components/_sidebar.html' %}

  <div class="flex min-h-full flex-col lg:pl-64">
    {% include 'components/_topbar.html' %}

    <main class="mx-auto w-full max-w-7xl px-4 py-6 md:px-8 md:py-8">
      {% include 'components/_messages.html' %}
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    document.getElementById('sidebar-toggle').addEventListener('click', function () {
      var isHidden = document.getElementById('sidebar').classList.toggle('hidden');
      this.setAttribute('aria-expanded', String(!isHidden));
    });
  </script>
{% endblock %}
