{% url 'dashboard' as dashboard_url %}
<header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-slate-800 bg-slate-900/70 px-4 backdrop-blur lg:hidden">
  <a href="{{ dashboard_url|default:'#' }}" class="rounded-md focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 text-xl font-bold tracking-tight text-gradient">Finanpy</a>
  <button type="button" id="sidebar-toggle" class="btn-ghost btn-sm" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menu">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
    </svg>
  </button>
</header>
